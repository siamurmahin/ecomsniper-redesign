# Netlify build configuration.
#
# The repo root is this directory, so no `base` is needed. Everything here is
# what Netlify cannot infer on its own or would infer differently from local.

# `build/client`, not `dist`. Under the router's framework mode the build runs
# twice — once for the browser, once in Node to render the HTML — and writes
# `build/client` (what is served) beside `build/server` (the renderer, which is
# not deployed). Left at `dist` this published the last Vite SPA build: one
# empty `<div id="root">` for every URL, none of the prerendered pages.
[build]
  command = "npm run build"
  publish = "build/client"

[build.environment]
  # Pinned so Netlify does not pick its own default, which drifts between
  # deploys. "22" was a floating major and satisfied nothing in particular;
  # react-router and @react-router/dev both declare `node >=22.22.0`, and
  # below it the build prints a version warning on every run. Same number in
  # `.nvmrc`, which is what CI reads.
  NODE_VERSION = "22.22.0"

# The playbook keeps the URL the live site already publishes,
# /free-play-book. /free-playbook was this rebuild's own spelling for a while,
# so it redirects here rather than 404ing. Declared before the SPA fallback
# because the first match wins, and forced so it beats the catch-all below.
[[redirects]]
  from = "/free-playbook"
  to = "/free-play-book"
  status = 301
  force = true

[[redirects]]
  from = "/de/free-playbook"
  to = "/de/free-play-book"
  status = 301
  force = true

# Anything else is a 404, and says so.
#
# This was `/* -> /index.html 200`, which an SPA needs: with one document for
# the whole site, every URL had to resolve to it. Every route is prerendered
# now, so Netlify serves the real file for each of them and this rule only ever
# sees a URL that does not exist — and answered it with the homepage under a
# 200, which is a soft 404: the visitor gets the wrong page and a crawler is
# told a typo'd link is a valid duplicate of the homepage.
#
# German first, so /de/anything gets the German 404 rather than the English one.
#
# A static file always beats a non-forced redirect, so this cannot shadow a
# prerendered page. The corollary is that a new route missing from `prerender`
# in `react-router.config.js` now 404s instead of quietly client-rendering.
# That is the intended trade: a missing page should fail loudly at the first
# request, not silently ship without HTML.
#
# `public/_redirects` says the same thing and ships in the build, but that file
# is easy to lose in a public/ clear-out — worth stating twice.
# The feature pages keep the readable slug; the camelCase spelling 301s onto
# it rather than being deleted. Decided 4 Sep — see docs/TODO.md.
[[redirects]]
  from = "/productHunterV6"
  to = "/product-hunter"
  status = 301

[[redirects]]
  from = "/de/productHunterV6"
  to = "/de/product-hunter"
  status = 301

[[redirects]]
  from = "/de/*"
  to = "/de/404/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

# Hashed assets are immutable: Vite writes the content hash into the filename,
# so a changed file is a new URL and this can never serve a stale one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The typefaces. Not content-hashed — they are referenced by name from the
# stylesheet and preloaded by name from index.html — so the filename carries
# the weight range instead, and a different file means a different name.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the one file with a stable URL, so it must always be revalidated
# — otherwise a visitor keeps loading a cached document pointing at assets from
# a previous deploy.
#
# Prerendering made this ten documents rather than one, and only the homepage's
# is named here. The rest are covered by Netlify's own default for HTML, which
# is this same header; the rule is kept because the requirement is ours, not
# the host's, and should not silently depend on that default staying put.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

    # A year of HTTPS-only, remembered by the browser, so a visitor who types
    # the bare domain or follows an old http:// link never makes the plaintext
    # request that a network in between could answer.
    #
    # No `includeSubDomains` and no `preload` on purpose. Both are one-way
    # doors: includeSubDomains binds every subdomain of the apex, and the
    # client runs at least one this repo does not deploy — sign that up only
    # once someone has confirmed it is HTTPS-only and will stay that way.
    Strict-Transport-Security = "max-age=31536000"

    # This site asks for none of these, so the browser can refuse them outright
    # — including on behalf of anything embedded later. When the chat widget
    # returns it will want none of them either; if a future feature does, add
    # it here deliberately rather than by leaving the door open.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), xr-spatial-tracking=()"
