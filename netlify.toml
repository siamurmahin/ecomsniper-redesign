# Netlify build configuration.
#
# The repo root is this directory, so no `base` is needed. Everything here is
# what Netlify cannot infer on its own or would infer differently from local.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Pinned to the version the site is built and tested against locally. Left
  # unset, Netlify picks its own default, which drifts between deploys.
  NODE_VERSION = "22"

# The playbook keeps the URL the live site already publishes,
# /free-play-book. /free-playbook was this rebuild's own spelling for a while,
# so it redirects here rather than 404ing. Declared before the SPA fallback
# because the first match wins, and forced so it beats the catch-all below.
[[redirects]]
  from = "/free-playbook"
  to = "/free-play-book"
  status = 301
  force = true

[[redirects]]
  from = "/de/free-playbook"
  to = "/de/free-play-book"
  status = 301
  force = true

# SPA fallback. `public/_redirects` says the same thing and ships in the build,
# but that file is easy to lose in a public/ clear-out and the failure it
# causes is a 404 on every route except "/" — worth stating twice.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable: Vite writes the content hash into the filename,
# so a changed file is a new URL and this can never serve a stale one.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is the one file with a stable URL, so it must always be revalidated
# — otherwise a visitor keeps loading a cached document pointing at assets from
# a previous deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
