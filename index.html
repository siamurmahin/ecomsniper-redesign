    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: preconnect first, then a single stylesheet request for all three families. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />

    <!--
      Preloader, inlined on purpose.

      The bundle has to download, parse and execute before React can render
      anything, and the shell paints long before that — measured, the document
      paints at ~116ms and the hero does not appear until ~1.3s. That gap was
      a blank page. This fills it, and it can only do that if it costs no
      request of its own: the mark is the favicon's own artwork pasted in, and
      the styles are here rather than in the bundle they are covering for.

      The spin is a CSS animation so it runs on the compositor. A spinner
      driven by JavaScript would stall exactly when the main thread is busiest,
      which is the entire time this is on screen — it would sit frozen while
      claiming to show progress.
    -->
    <style>
      /* Every value here is literal. This renders before the bundle's
         stylesheet exists, so there are no design tokens to reach for — these
         are copied from `--color-paper`, `--color-ink`, `--color-brand-red`,
         `--color-brand-violet` and `--color-accent`. If those change, change
         these. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        /* The hero's own floor: red behind the copy, blue behind the panel.
           The preloader dissolves into the page it is covering rather than
           cutting to it from a flat white card. */
        background:
          radial-gradient(48rem 36rem at 12% 14%, rgba(208, 33, 42, 0.06), transparent 68%),
          radial-gradient(52rem 40rem at 88% 28%, rgba(0, 100, 210, 0.09), transparent 70%), #fbfbfa;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #preloader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .preloader-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: preloader-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #preloader svg {
        width: 62px;
        height: 62px;
      }
      /* Only the rings and spikes turn. The centre dot is the thing being
         aimed with, so it holds still and the reticle rolls around it. */
      #preloader .reticle-spin {
        transform-origin: 32px 32px;
        animation: preloader-spin 1.15s linear infinite;
      }
      /* Set rather than drawn: the wordmark artwork is a PNG, and inlining it
         as a data URI to save a request would bloat the very document whose
         parse speed this depends on. The stack falls back to the system UI
         face, so it is legible from the first frame whether or not the
         webfont has arrived. */
      #preloader .preloader-word {
        font-family: 'Bricolage Grotesque', 'Montserrat', system-ui, sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #1e1f23;
        line-height: 1;
      }
      /* An indeterminate sweep, not a progress bar. Nothing here knows how far
         through the load it is, and a bar that pretends to is lying. */
      #preloader .preloader-track {
        position: relative;
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(30, 31, 35, 0.08);
      }
      #preloader .preloader-track::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(135deg, #d0212a 0%, #8e2a86 48%, #0064d2 100%);
        animation: preloader-sweep 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes preloader-in {
        from {
          opacity: 0;
          transform: translate3d(0, 8px, 0);
        }
      }
      @keyframes preloader-sweep {
        0% {
          transform: translate3d(-100%, 0, 0);
        }
        100% {
          transform: translate3d(100%, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .reticle-spin,
        #preloader .preloader-stack,
        #preloader .preloader-track::after {
          animation: none;
        }
        /* With no sweep the track would read as an empty slot, so fill it. */
        #preloader .preloader-track::after {
          transform: none;
        }
      }
    </style>

    <!-- Organisation + product data for rich results. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EcomSniper",
        "url": "https://ecomsniper.io/",
        "logo": "https://ecomsniper.io/favicon.svg",
        "description": "eBay dropshipping automation software, training and community.",
        "sameAs": ["https://uk.trustpilot.com/review/ecomsniper.io"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "availableLanguage": ["English"],
          "hoursAvailable": "Mo-Su 00:00-23:59"
        }
      }
    </script>
  </head>

  <body>
    <div id="preloader" role="status" aria-label="Loading EcomSniper">
      <div class="preloader-stack">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g class="reticle-spin" fill="none" stroke-linecap="round">
            <circle cx="32" cy="32" r="24" stroke="#86b817" stroke-width="4" />
            <circle cx="32" cy="32" r="16.5" stroke="#0064d2" stroke-width="6" />
            <path d="M32 5v11M32 48v11M5 32h11M48 32h11" stroke="#f5af02" stroke-width="6" />
          </g>
          <circle cx="32" cy="32" r="9.5" fill="#e53238" />
          <circle cx="32" cy="32" r="3.6" fill="#fbfbfa" />
        </svg>

        <!-- aria-hidden: the wrapper's label already says this, and a screen
             reader should not hear the name twice. -->
        <span class="preloader-word" aria-hidden="true">EcomSniper</span>
        <span class="preloader-track" aria-hidden="true"></span>
      </div>
    </div>

    <script>
      /* Backstop. The app removes this as soon as it has painted; this is
         only here so a bundle that never executes cannot leave a visitor
         staring at a spinner forever. */
      setTimeout(function () {
        var el = document.getElementById('preloader');
        if (el) el.remove();
      }, 6000);
    </script>

    <div id="root"></div>

        </p>
        <p>Plans start at $97 for your first month, protected by a 30 day money back guarantee.</p>
        <p><a href="https://ecomsniper.io/pricing">See full plan details</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
