    <!-- Fonts: preconnect first, then a single stylesheet request for all three families. -->

      rel="stylesheet"
    />

    <!--
      Preloader, inlined on purpose.

      The bundle has to download, parse and execute before React can render
      anything, and the shell paints long before that — measured, the document
      paints at ~116ms and the hero does not appear until ~1.3s. That gap was
      a blank page. This fills it, and it can only do that if it costs no
      request of its own: the mark is the favicon's own artwork pasted in, and
      the styles are here rather than in the bundle they are covering for.

      The spin is a CSS animation so it runs on the compositor. A spinner
      driven by JavaScript would stall exactly when the main thread is busiest,
      which is the entire time this is on screen — it would sit frozen while
      claiming to show progress.
    -->
    <style>
      /* Every value here is literal. This renders before the bundle's
         stylesheet exists, so there are no design tokens to reach for — these
         are copied from `--color-paper`, `--color-ink`, `--color-brand-red`,
         `--color-brand-violet` and `--color-accent`. If those change, change
         these. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        /* The hero's own floor: red behind the copy, blue behind the panel.
           The preloader dissolves into the page it is covering rather than
           cutting to it from a flat white card. */
        background:
          radial-gradient(48rem 36rem at 12% 14%, rgba(208, 33, 42, 0.06), transparent 68%),
          radial-gradient(52rem 40rem at 88% 28%, rgba(0, 100, 210, 0.09), transparent 70%), #fbfbfa;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #preloader.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .preloader-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: preloader-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      #preloader .reticle-spin {
        width: 62px;
        height: 62px;
      }
      /* The whole mark turns. The drawn version kept its centre dot still
         and rolled the rings around it, which a single flat image cannot do —
         and at 62px, spinning it whole reads the same. */
      #preloader .reticle-spin {
        transform-origin: 50% 50%;
        animation: preloader-spin 1.15s linear infinite;
      }
      /* The wordmark itself, not type set to look like it. It used to be the
         name in the display face with a system fallback, which meant the
         first frame showed one shape and the frame after the webfont landed
         showed another. 12.5KB, and it is the black-lettering artwork
         because this sits on paper. */
      #preloader .preloader-word {
        width: 124px;
        height: auto;
      }
      /* An indeterminate sweep, not a progress bar. Nothing here knows how far
         through the load it is, and a bar that pretends to is lying. */
      #preloader .preloader-track {
        position: relative;
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(30, 31, 35, 0.08);
      }
      #preloader .preloader-track::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(135deg, #d0212a 0%, #8e2a86 48%, #0064d2 100%);
        animation: preloader-sweep 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes preloader-in {
        from {
          opacity: 0;
          transform: translate3d(0, 8px, 0);
        }
      }
      @keyframes preloader-sweep {
        0% {
          transform: translate3d(-100%, 0, 0);
        }
        100% {
          transform: translate3d(100%, 0, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader .reticle-spin,
        #preloader .preloader-stack,
        #preloader .preloader-track::after {
          animation: none;
        }
        /* With no sweep the track would read as an empty slot, so fill it. */
        #preloader .preloader-track::after {
          transform: none;
        }
      }
    </style>

    <!-- Organisation + product data for rich results. -->
    <script type="application/ld+json">

  <body>
    <div id="preloader" role="status" aria-label="Loading EcomSniper">
      <div class="preloader-stack">
        <!-- The real mark, not a redrawing of it. The hand-built SVG that
             stood here was close but not the artwork: its ring weights and
             spike lengths were guesses, and it was the one place on the site
             showing a logo nobody had approved. 19KB, fetched in parallel
             with the bundle it is covering for. -->
        <img
          src="/logo-reticle.png"
          alt=""
          aria-hidden="true"
          width="335"
          height="333"
          class="reticle-spin"
        />

        <!-- aria-hidden: the wrapper's label already says this, and a screen
             reader should not hear the name twice. -->
        <img
          src="/logo-preloader.png"
          alt=""
          aria-hidden="true"
          width="359"
          height="107"
          class="preloader-word"
        />
        <span class="preloader-track" aria-hidden="true"></span>
      </div>
    </div>

    <script>
      /* Backstop. The app removes this as soon as it has painted; this is
         only here so a bundle that never executes cannot leave a visitor
         staring at a spinner forever. */
      setTimeout(function () {
        var el = document.getElementById('preloader');
        if (el) el.remove();
      }, 6000);
    </script>

    <div id="root"></div>

    <!--
      Live chat, taken from the live site so it is the same inbox: property
      6760d1e1af5bfec1dbdd3f59, widget 1if937n1d.

      Gated on the hostname exactly as the live site gates it. This is not a
      cookie banner — it is a domain guard, so localhost, every preview build
      and every staging URL stay out of the real support queue. The port is
      not part of location.hostname, so no dev port needs listing. To turn it
      on for another domain, add it to the test.

      The widget is also why the FAQ can promise support "around the clock":
      this is the thing that answers.
    -->
    <script>
      window.__ECOM_TRACKING_OK__ = /(^|\.)ecomsniper\.io$/i.test(location.hostname);
    </script>
    <script type="text/javascript">
      var Tawk_API = Tawk_API || {},
        Tawk_LoadStart = new Date();
      if (window.__ECOM_TRACKING_OK__) {
        (function () {
          var s1 = document.createElement('script'),
            s0 = document.getElementsByTagName('script')[0];
          s1.async = true;
          s1.src = 'https://embed.tawk.to/6760d1e1af5bfec1dbdd3f59/1if937n1d';
          s1.charset = 'UTF-8';
          s1.setAttribute('crossorigin', '*');
          s0.parentNode.insertBefore(s1, s0);
